name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvnw 可执行权限
        run: chmod +x recommend-server/mvnw

      # 用例全部基于 Mockito/H2，不依赖真实 MySQL，因此无需起数据库容器
      - name: 单元测试
        working-directory: recommend-server
        run: ./mvnw -B test

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: recommend-server/target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: recommend-web/package-lock.json

      # 用 ci 而不是 install：锁文件与 package.json 不一致时直接失败，
      # 避免「本地能跑、CI 装出另一套依赖」
      - name: 安装依赖
        working-directory: recommend-web
        run: npm ci

      - name: 生产构建
        working-directory: recommend-web
        run: npm run build
